{% set name = "psutil" %}
{% set version = "7.2.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0746f5f8d406af344fd547f1c8daa5f5c33dbc293bb8d6a16d80b4bb88f59372

build:
  number: 0
  skip: true  # [py<37]
  script:
    # macOS renamed this variable, but it is `NULL` in either case.
    # Workaround the missing definition by setting it to `0`.
    #
    # xref: https://github.com/giampaolo/psutil/issues/2354
    - export CFLAGS="${CFLAGS} -DkIOMainPortDefault=kIOMasterPortDefault"  # [osx]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - python
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools >=43
    - wheel
  run:
    - python

# FileNotFoundError: [Errno 2] No such file or directory:
# '$PREFIX/lib/python3.12/site-packages/scripts/*'

#E   ModuleNotFoundError: No module named 'psleak'
# psleak is not a part of Anaconda main channel
{% set SKIP_TEST_FILES = [
  "tests/test_scripts.py",
  "tests/test_memleaks.py"
] %}
{% set SKIP_TEST_OSX = [
  "test_disks",
  "test_vmem_active",
  "test_vmem_free",
  "test_vmem_inactive",
  "test_vmem_wired",
  "test_disk_usage",
  "test_all",
  "test_users",
  "test_long_name",
  "test_proc_cmdline",
  "test_proc_net_connections"
] %}
{% set SKIP_TEST_LINUX = [
  "test_against_findmnt",
  "test_comparisons",
  "test_disk_partitions_mocke",
  "test_cmdline",
  "test_name",
  "test_users",
  "test_pmap",
  "test_python2",
  "test_proc_name",
  "test_against_df",
  "test_all",
  "test_long_name",
  "test_proc_cmdline",
  "test_heap_info"
] %}
{% set SKIP_TEST_WIN = [
  "test_users",
  "test_pmap",
  "test_winservices",
  "test_long_cmdline",
  "test_boot_time",
  "test_cmdline",
  "test_create_time",
  "test_win_service_iter",
  "test_it",
  "test_pids",
  "test_free_phymem"
] %}
{% set SKIP_TEST_LIST = [
  
] %}
{% set SKIP_TEST_LIST = SKIP_TEST_LIST + SKIP_TEST_OSX %}  # [osx]
{% set SKIP_TEST_LIST = SKIP_TEST_LIST + SKIP_TEST_LINUX %}  # [linux]
{% set SKIP_TEST_LIST = SKIP_TEST_LIST + SKIP_TEST_WIN %}  # [win]

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
  imports:
    - psutil
    - psutil._psutil_linux  # [linux]
    - psutil._psutil_osx  # [osx]
    - psutil._psutil_windows  # [win]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pip install pywin32 wmi  # [win]
    - python -m pytest tests {% for file in SKIP_TEST_FILES %} --ignore={{ file }}{% endfor %} -vv -k "not ({{ SKIP_TEST_LIST | join(' or ') }})"

about:
  home: https://github.com/giampaolo/psutil
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A cross-platform process and system utilities module for Python
  description: |
    psutil (process and system utilities) is a cross-platform library for
    retrieving information on running processes and system utilization (CPU,
    memory, disks, network) in Python. It is useful mainly for system
    monitoring, profiling and limiting process resources and management of
    running processes
  doc_url: https://psutil.readthedocs.io
  dev_url: https://github.com/giampaolo/psutil

extra:
  recipe-maintainers:
    - gqmelo
    - jakirkham
    - jjhelmus
    - pelson
    - nehaljwani
